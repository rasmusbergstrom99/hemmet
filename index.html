<body>
<a class="skip" href="#main">Hoppa till innehållet</a>

<header class="top">
  <div class="brand">
    <h1>Vårt hem</h1>
    <p>Möbler, budget och moodboard</p>
  </div>
  <nav class="tabs" aria-label="Vyer">
    <a href="#kalkyl" data-view="kalkyl"><svg class="ic" aria-hidden="true"><use href="ikoner.svg?v=2#i-coins"/></svg><span>Kalkyl</span></a>
    <a href="#budget" data-view="budget"><svg class="ic" aria-hidden="true"><use href="ikoner.svg?v=2#i-wallet"/></svg><span>Budget</span></a>
    <a href="#moodboard" data-view="moodboard"><svg class="ic" aria-hidden="true"><use href="ikoner.svg?v=2#i-images-square"/></svg><span>Moodboard</span></a>

  </nav>
  <div class="top-actions" id="top-actions"></div>
  <button id="chatgpt" class="btn btn-sm chat-entry" type="button" hidden>
    <svg class="ic" aria-hidden="true"><use href="ikoner.svg?v=2#i-chat-circle-text"/></svg>ChatGPT
  </button>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main" tabindex="-1">
  <section id="view-kalkyl" class="view" aria-label="Kalkyl"></section>
  <section id="view-budget" class="view" aria-label="Budget" hidden></section>
  <section id="view-moodboard" class="view" aria-label="Moodboard" hidden></section>
  <section id="view-ritning" class="view" aria-label="Ritning" hidden></section>
</main>

<button id="fab" class="fab" type="button" hidden>
  <svg class="ic" aria-hidden="true"><use href="ikoner.svg?v=2#i-plus"/></svg><span></span>
</button>

<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="dlg" class="sheet" aria-labelledby="dlg-title"></dialog>

<noscript><p class="noscript">Sidan behöver JavaScript för att visa listan.</p></noscript>
